[project]
name = "voice-input"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["sherpa-onnx", "sounddevice", "numpy", "pystray", "pillow"]

[project.scripts]
voice-input = "voice_input:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["voice_input"]
